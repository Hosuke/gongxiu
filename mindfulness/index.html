    <meta charset="UTF-8" />

      content="从起床、洗漱、为食、洗碗到打扫，在日常五处练习正念。"

    <meta property="og:type" content="website" />

      property="og:description"
      content="起床、洗漱、为食、洗碗、打扫。在在处处，练习正念。"
    />

    <meta name="twitter:card" content="summary" />

    <meta
      name="twitter:description"
      content="起床、洗漱、为食、洗碗、打扫。在在处处，练习正念。"
    />

    <link rel="stylesheet" href="../styles.css?v=20260901-1" />
    <script src="./app.js?v=20260901-1" defer></script>
  </head>
  <body class="mindfulness-page">
    <div class="page-shell mindfulness-shell">
      <header class="hero mindfulness-hero">
        <nav class="practice-nav" aria-label="页面导航">
          <a href="../"><span aria-hidden="true">←</span> 返回每日共修</a>
        </nav>
        <p class="eyebrow">Mindfulness in Daily Life</p>
        <h1>五处用心</h1>
        <p class="hero-copy">
          起床、洗漱、为食、洗碗、打扫。修行不另择时处，只在眼前这一事、当下这一念。
        </p>
        <div class="mindfulness-intention" aria-label="在在处处，练习正念">
          <span>在在处处</span>
          <strong>练习正念</strong>
        </div>
      </header>

      <main class="mindfulness-layout">
        <section class="panel mindfulness-library" aria-labelledby="practice-list-title">
          <div class="panel-head mindfulness-panel-head">
            <div>
              <p class="panel-kicker">Five Everyday Practices</p>
              <h2 id="practice-list-title">此刻，正在做哪一件事？</h2>
            </div>
            <p class="mindfulness-list-note">不必依次完成，只选择眼前这一处。</p>
          </div>

          <ol class="mindfulness-list" id="mindfulness-list">
            <li>
              <button class="mindfulness-card" type="button" data-practice-index="0">
                <span class="mindfulness-number">一</span>
                <span class="mindfulness-card-copy">
                  <span class="mindfulness-card-meta">清晨 · 05:34</span>
                  <strong>正念起床</strong>
                  <span>从睁眼与起身开始，回到身体和呼吸。</span>
                </span>
                <span class="mindfulness-card-action">开始</span>
              </button>
            </li>
            <li>
              <button class="mindfulness-card" type="button" data-practice-index="1">
                <span class="mindfulness-number">二</span>
                <span class="mindfulness-card-copy">
                  <span class="mindfulness-card-meta">盥洗 · 04:58</span>
                  <strong>正念洗漱</strong>
                  <span>让水声、触感与每个动作成为觉知的提醒。</span>
                </span>
                <span class="mindfulness-card-action">开始</span>
              </button>
            </li>
            <li>
              <button class="mindfulness-card" type="button" data-practice-index="2">
                <span class="mindfulness-number">三</span>
                <span class="mindfulness-card-copy">
                  <span class="mindfulness-card-meta">一餐 · 10:03</span>
                  <strong>正念为食</strong>
                  <span>家庭版。于一餐之间，看见食物的来处与彼此。</span>
                </span>
                <span class="mindfulness-card-action">开始</span>
              </button>
            </li>
            <li>
              <button class="mindfulness-card" type="button" data-practice-index="3">
                <span class="mindfulness-number">四</span>
                <span class="mindfulness-card-copy">
                  <span class="mindfulness-card-meta">餐后 · 05:39</span>
                  <strong>正念洗碗</strong>
                  <span>安住于重复的动作，不急着赶往下一件事。</span>
                </span>
                <span class="mindfulness-card-action">开始</span>
              </button>
            </li>
            <li>
              <button class="mindfulness-card" type="button" data-practice-index="4">
                <span class="mindfulness-number">五</span>
                <span class="mindfulness-card-copy">
                  <span class="mindfulness-card-meta">洒扫 · 10:34</span>
                  <strong>正念打扫</strong>
                  <span>扫去尘埃，也照见当下；含磬声引导。</span>
                </span>
                <span class="mindfulness-card-action">开始</span>
              </button>
            </li>
          </ol>
        </section>

        <aside class="panel mindfulness-player-panel" aria-labelledby="mindfulness-player-title">
          <div class="mindfulness-player-shell">
            <div class="mindfulness-player-heading">
              <p class="panel-kicker" id="mindfulness-now-label">第一处 · 清晨</p>
              <h2 id="mindfulness-player-title">正念起床</h2>
              <p id="mindfulness-player-description">
                从睁眼与起身开始，回到身体和呼吸。
              </p>
            </div>

            <div class="practice-orbit" aria-hidden="true">
              <span class="practice-orbit-ring"></span>
              <span class="practice-orbit-core">心</span>
            </div>

            <div class="mindfulness-controls">
              <button class="button button-primary" id="mindfulness-play-button" type="button">
                开始练习
              </button>
              <button class="button" id="mindfulness-restart-button" type="button">
                从头开始
              </button>
            </div>

            <label class="range-wrap mindfulness-range" for="mindfulness-progress-range">
              <span>练习进度</span>
              <input
                id="mindfulness-progress-range"
                type="range"
                min="0"
                max="3340"
                value="0"
                step="1"
              />
            </label>

            <div class="time-row">
              <span id="mindfulness-current-time">00:00</span>
              <span id="mindfulness-duration-time">05:34</span>
            </div>

            <audio id="mindfulness-audio" preload="metadata"></audio>
            <p class="mindfulness-status" id="mindfulness-status" role="status">
              准备好时，轻轻按下“开始练习”。
            </p>

            <div class="mindfulness-cue">
              <span aria-hidden="true">一念</span>
              <p>无需把日常变成别的样子。听见、触到、呼吸，便可从此处开始。</p>
            </div>
          </div>
        </aside>
      </main>

      <footer class="mindfulness-footer">
        <p>五处用心，不为多做一件事，只为清楚正在做的这一件事。</p>
        <a href="../">返回皈依共修</a>
      </footer>
    </div>
  </body>
</html>
